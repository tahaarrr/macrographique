name: macrographique
description: "Macrographique — génération et sauvegarde de Rapports d'Essai Macrographiques."
publish_to: 'none'
version: 1.2.2+7

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Base de données locale
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  sqlite3_flutter_libs: ^0.5.0   # fournit sqlite3.dll pour Windows/Linux/macOS
  path: ^1.9.0

  # Gestion des fichiers / dossiers
  path_provider: ^2.1.3

  # Sélection / capture de photos
  image_picker: ^1.1.2

  # Génération et affichage de PDF
  pdf: ^3.11.0
  printing: ^5.13.1

  # Formatage dates
  intl: ^0.19.0

  # Paramètres persistants (identité société, logo, en-tête personnalisable)
  shared_preferences: ^2.2.3

  # Partage de fichiers (PDF généré, Sauvegardes)
  share_plus: ^9.0.0

  # Sélection de fichiers (Sauvegardes JSON / DB)
  file_picker: ^8.0.0
  sqflite_common_ffi_web: ^0.4.3+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/logo.png
