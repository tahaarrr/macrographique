<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page non trouvée : Macrographique</title>
  <meta name="description" content="Page introuvable sur le site Macrographique.">
  <script>
    var base = '/macrographique/';
    var path = window.location.pathname;
    if (path !== base && path !== base + 'index.html') {
      window.location.replace(base + '?redirect=' + encodeURIComponent(path));
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500&family=Atkinson+Hyperlegible+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
/* Hallmark: 2.0.0
   theme: console (console: graphite)
   shape: Workbench
   draw: e1128a
   modes: dark
*/
    :root {
      --font-body: "Host Grotesk", ui-sans-serif, system-ui, sans-serif;
      --font-mono: "Atkinson Hyperlegible Mono", ui-monospace, monospace;
      --paper: oklch(17% 0.008 250);
      --ink: oklch(95% 0.005 250);
      --muted: oklch(71% 0.01 250);
      --accent: oklch(82% 0.15 80);
      --accent-ink: oklch(18% 0.04 75);
      --rule: oklch(31% 0.01 250);
      --color-focus: oklch(82% 0.15 80);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      overflow-x: clip;
      font-family: var(--font-body);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    :focus-visible {
      outline: 2px solid var(--color-focus);
      outline-offset: 2px;
    }
    :active {
      transform: translateY(1px);
    }
    .wrap { padding: 40px 24px; max-width: 480px; }
    .code {
      font-family: var(--font-mono);
      font-size: 72px;
      font-weight: 500;
      color: var(--muted);
      line-height: 1;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 24px;
      font-weight: 500;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      text-wrap: balance;
    }
    p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
      margin-bottom: 32px;
    }
    a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      background: var(--accent);
      color: var(--accent-ink);
      border-radius: 6px;
      text-decoration: none;
      font-weight: 500;
      font-size: 14px;
      transition: opacity 180ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    a:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>Page non trouvée</h1>
    <p>Cette page n’existe pas. Retournez à l’accueil de Macrographique.</p>
    <a href="/macrographique/">Retour à l’accueil</a>
  </div>
</body>
</html>
